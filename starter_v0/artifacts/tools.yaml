# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Hỏi người dùng khi thiếu thông tin cần thiết hoặc khi cần xác nhận lần đầu
      trước một hành động có side effect như gửi hoặc publish.

      Chỉ dùng response_type="yes_no" khi yêu cầu gửi/publish chưa được xác nhận.

      Không dùng tool này nếu lượt ngay trước đã hỏi xác nhận và người dùng vừa trả lời
      rõ ràng như: "có", "đồng ý", "ok", "xác nhận", "gửi đi", "có gửi đi",
      "yes", hoặc "confirm". Trong trường hợp đó, thực hiện hành động đang chờ với
      confirmed=true.

      Nếu người dùng trả lời rõ ràng là "không", "hủy", "đừng gửi" hoặc "no",
      hủy hành động và không gọi tool gửi.

      Chỉ hỏi lại khi câu trả lời thực sự mơ hồ.
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "Câu hỏi ngắn gọn, nêu rõ thông tin còn thiếu hoặc hành động cần xác nhận."

        response_type:
          type: string
          enum: [ text, yes_no, choice ]
          default: "text"
          description: >
            Dùng "yes_no" cho xác nhận lần đầu trước hành động gửi/publish.
            Dùng "text" khi cần người dùng bổ sung thông tin tự do.
            Dùng "choice" khi người dùng cần chọn một trong các options.
            Không dùng "yes_no" lần nữa nếu người dùng đã xác nhận rõ ở lượt hiện tại.

        options:
          type: array
          default: [ ]
          items:
            type: string
          description: >
            Danh sách lựa chọn khi response_type="choice".
            Để [] với response_type="text" hoặc "yes_no".

      required:
        - question
        - response_type

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu policy nội bộ của công ty. Dùng cho câu hỏi về source/citation, data privacy, external publishing, AI research workflow, hoặc tool usage. Luôn chọn policy_area cụ thể nếu có thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm policy: source/citation/source verification/arXiv citation -> source_citation; API keys/secrets/prompts/customer data/privacy -> data_privacy; sending/publishing/Telegram/approval/external channels -> external_publishing; research workflow -> ai_research; tool usage -> tool_usage; otherwise all."}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query, policy_area]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
